[package]
name = "holonic_speed"
version = "0.1.0"
edition = "2021"

[lib]
name = "holonic_speed"
crate-type = ["cdylib"]

[features]
default = ["onnx"]
onnx = ["ort"]

[dependencies]
pyo3 = { version = "0.23.3", features = ["extension-module", "abi3-py312"] }
rayon = "1.10"
sha2 = "0.10"
rand = "0.8"
rand_distr = "0.4"
ort = { version = "2.0.0-rc.11", optional = true }
